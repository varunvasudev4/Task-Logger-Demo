<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TTL Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font,'IBM Plex Sans',system-ui,sans-serif);min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#wp{position:fixed;inset:0;z-index:-1;display:none;background-size:cover;background-repeat:no-repeat;pointer-events:none;overflow:hidden}
#wp::after{content:"";position:absolute;inset:0;background:var(--bg-tertiary);opacity:var(--dim,.25)}
.wrap{max-width:1500px;margin:0 auto;padding:12px}
.card,header.top,.fbar{background:color-mix(in srgb,var(--bg) 93%,transparent);border:1px solid var(--border);border-radius:12px}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.ph{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--blue-mid);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
header.top h1{font-size:1.1rem;margin:0}header.top small{color:var(--text-secondary);display:block}
.sp{flex:1}
button,select,input,a.btn{font:inherit;color:var(--text-primary);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px}
button{cursor:pointer}button:hover,a.btn:hover{border-color:var(--blue-mid)}
button.pri,a.btn.pri{background:var(--blue-mid);color:#fff;border-color:var(--blue-mid)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.fbar{position:sticky;top:0;z-index:8;margin:10px 0;padding:8px 10px}
.fhead{display:flex;align-items:center;gap:8px}.fhead .sm{flex:1;min-width:0;color:var(--text-secondary);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbody{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-top:8px;max-height:68vh;overflow:auto}
.fbar.col .fbody{display:none}
.fbody>label{font-size:.72rem;color:var(--text-secondary);display:grid;gap:2px}
.fbody .q{grid-column:span 2}.fbody .full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{padding:3px 10px;min-height:28px;font-size:.8rem}
.kw{display:inline-flex;gap:4px;align-items:center;background:var(--bg-secondary);border-radius:14px;padding:2px 4px 2px 10px;font-size:.8rem}.kw button{border:0;background:none;min-height:22px;padding:0 6px}
details.ms{position:relative}details.ms>summary{list-style:none;cursor:pointer;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px;display:flex;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--text-primary)}
details.ms>summary::after{content:"▾";margin-left:6px;color:var(--text-tertiary)}details.ms[open]>summary{border-color:var(--blue-mid)}
details.ms .menu{position:absolute;z-index:20;left:0;min-width:100%;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menu label{display:flex;gap:6px;align-items:center;padding:3px 4px;font-size:.85rem;white-space:nowrap;color:var(--text-primary)}.menu button{width:100%;margin-top:4px;min-height:28px}
#grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.w{padding:12px;min-width:0}
.w>header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.w h3{margin:0;font-size:.9rem;color:var(--text-secondary);font-weight:600;flex:1;min-width:0}
.tb{display:none;gap:4px}body.edit .tb{display:flex}body.edit .w{outline:2px dashed var(--border)}
.wt{display:flex;gap:4px}.tb button,.wt button{padding:0 8px;min-height:28px}
.w.fs{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;background:var(--bg)}.w.fs .sc{max-height:calc(100vh - 150px)}
.kv{font-size:2rem;font-weight:700;color:var(--blue-mid);line-height:1.2}
.mt{color:var(--text-tertiary);font-size:.85rem}
.hb{display:grid;grid-template-columns:minmax(60px,32%) 1fr auto;gap:8px;align-items:center;font-size:.8rem;margin:5px 0}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t{background:var(--bg-secondary);border-radius:6px;height:12px}.hb i{display:block;height:100%;border-radius:6px}
.vb{display:flex;gap:6px;align-items:flex-end;height:200px;overflow-x:auto}
.vb .c{flex:1;min-width:40px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.68rem}
.vb .c>i{width:70%;border-radius:4px 4px 0 0;min-height:2px}.vb .c span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.stk{width:70%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}.stk i{width:100%;display:block}
.lg2{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;margin-top:8px;color:var(--text-secondary)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:130px;flex:none}.lg{font-size:.8rem;flex:1;min-width:120px}.lg div{display:flex;gap:6px;margin:3px 0}.lg b{margin-left:auto}.lg i{width:10px;height:10px;border-radius:3px;margin-top:4px;flex:none}
.sc{overflow:auto;max-height:440px}
table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--bg);color:var(--text-secondary);z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
table.g{table-layout:fixed;width:auto}table.g td{white-space:normal;word-break:break-word}
th .pn{opacity:.4;margin-left:4px;font-size:.7rem}th .pn.on{opacity:1;color:var(--blue-mid)}
th .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none}th .rz:hover{background:var(--blue-mid);opacity:.5}
th,td{position:relative}tr[data-a=hist]{cursor:pointer}tr[data-a=hist]:hover td{background:var(--bg-secondary)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:.8rem;color:var(--text-secondary);flex-wrap:wrap}.pg button,.pg select{min-height:28px;padding:2px 8px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text-primary);width:min(560px,94vw);padding:16px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}.fg label{display:grid;gap:3px;font-size:.78rem;color:var(--text-secondary)}.fg .full{grid-column:1/-1}
.cl>div{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}.cl label{flex:1;display:flex;gap:6px;align-items:center}.cl button{min-height:28px;padding:0 8px}
#msg{margin:10px 0;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--amber-mid);font-size:.85rem;display:none}
@media(max-width:1024px){#grid{grid-template-columns:repeat(6,minmax(0,1fr))}.s3,.s4{grid-column:span 3}.s6,.s8,.s12{grid-column:span 6}}
@media(max-width:640px){.wrap{padding:8px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:span 1}.s4,.s6,.s8,.s12{grid-column:span 2}.fbody .q{grid-column:1/-1}.fg{grid-template-columns:1fr}.kv{font-size:1.5rem}header.top .sp{display:none}.pg{justify-content:space-between}}
@media print{body{background:#fff}header.top button,header.top a,.fbar .fhead button,.tb,.wt,.pg,.fbody{display:none!important}.fbar{position:static}#wp{display:none!important}.w{break-inside:avoid}.sc{max-height:none}}
</style></head><body>
<div id="wp"></div>

</div>

</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="eX">Cancel</button><button class="pri" id="eOk">Save</button></div></dialog>
<dialog id="dlgC"><h3 style="margin:0 0 8px">Manage columns</h3><div class="cl" id="cl" style="overflow:auto;max-height:60vh"></div><div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px"><button id="cRst">Reset table</button><button class="pri" id="cOk">Done</button></div></dialog>
<dialog id="dlgH"><h3 style="margin:0 0 8px" id="hT"></h3><div class="sc" id="hB"></div><div style="text-align:right;margin-top:12px"><button class="pri" id="hX">Close</button></div></dialog>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pad=n=>String(n).padStart(2,'0');
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const J=(k,d)=>{try{const v=JSON.parse(LS(k));return v==null?d:v}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
// TTL data is READ ONLY. This page writes only its own keys below.
const LAYOUT_KEY='ttl_dash_layout_v2',UI_KEY='ttl_dash_ui',SAVED_KEY='ttl_dash_saved_filters';
const LIGHT={'--bg':'#fffdf8','--bg-secondary':'#f7f0dd','--bg-tertiary':'#ede1c3','--text-primary':'#26211a','--text-secondary':'#5a4f3c','--text-tertiary':'#8a7f68','--border':'rgba(38,33,26,0.16)','--green-mid':'#2f8f76','--amber-mid':'#a3821f','--blue-mid':'#c94f1f','--purple-mid':'#6a5cb0','--red-mid':'#b1403c'};
const DARK={'--bg':'#1c2230','--bg-secondary':'#232a3d','--bg-tertiary':'#0c0e13','--text-primary':'#edeff4','--text-secondary':'#8b93a7','--text-tertiary':'#5b6478','--border':'#2e3549','--green-mid':'#3fab8f','--amber-mid':'#d1b954','--blue-mid':'#e8622c','--purple-mid':'#8b7fd1','--red-mid':'#d9534f'};
const PAL=['--blue-mid','--green-mid','--amber-mid','--purple-mid','--red-mid'],col=i=>i<5?`var(${PAL[i]})`:`color-mix(in srgb,var(${PAL[i%5]}) 55%,var(--bg))`;
const PRE={valley:'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80',forest:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2000&q=80',night:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80'};
const FONTS={default:"'IBM Plex Sans',system-ui,sans-serif",spacegrotesk:"'Space Grotesk','IBM Plex Sans',sans-serif",mono:"'IBM Plex Mono',ui-monospace,monospace",serif:"Georgia,'Times New Roman',serif"},SCALE={sm:.9,md:1,lg:1.1,xl:1.2};
const DEFCOLS=[['date','Date'],['employee','Employee Name'],['project','Project'],['module','Module / Feature'],['nature','Nature of Task'],['ticket','Ticket #'],['description','Task progress / Effort description'],['effort','Effort (Minutes)'],['status','Status'],['remark','Remark']].map(([key,label])=>({key,label,showInLogTable:true}));
const TIME=['date','week','month','weekday'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],TL={date:'Day',week:'Week',month:'Month',weekday:'Weekday',heading:'Task'};
const LOGW={heading:200,date:110,employee:130,project:130,module:150,nature:120,ticket:110,description:260,effort:90,status:100,remark:200};
const MEAS={minutes:'Minutes',hours:'Hours',count:'Entry count'},FK=['project','nature','module','employee','status'];
const emptyF=()=>({from:'',to:'',project:[],nature:[],module:[],employee:[],status:[],kw:[],q:''});
let D,rows=[],F=emptyF(),L,editing=null,UI=Object.assign({fcol:false},J(UI_KEY,{})),FS=null,CSVS={},COLS={};
function readLocal(){return{log:J('ttl_log',[]),tasks:J('ttl_tasks',[]),masters:J('ttl_masters',{}),user:LS('ttl_username')||'',theme:LS('ttl_theme')||'system',wpUp:LS('ttl_wallpaper_upload')||'',photo:LS('ttl_user_photo')||'',src:'Task Time Logger'}}
const cols=()=>Array.isArray(D.masters.logColumns)&&D.masters.logColumns.length?D.masters.logColumns:DEFCOLS;
const label=k=>TL[k]||(cols().find(c=>c.key===k)||{}).label||k;
function theme(){const m=D.masters,dark=D.theme==='dark'||(D.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
 const o=((m.colorPrefs||{})[dark?'dark':'light'])||{},v=Object.assign({},dark?DARK:LIGHT);
 Object.keys(o).forEach(k=>{if(/^#[0-9a-f]{3,8}$/i.test(o[k]))v[k]=o[k]});
 Object.keys(v).forEach(k=>document.documentElement.style.setProperty(k,v[k]));
 const f=m.fontPrefs||{};let fam=FONTS[f.family]||FONTS.default;if(f.family==='custom'&&f.customFamily)fam=String(f.customFamily).replace(/^\s*font-family\s*:/i,'').replace(/;+\s*$/,'');
 document.documentElement.style.setProperty('--font',fam);document.documentElement.style.fontSize=(SCALE[f.size]||1)*16+'px'}
function wallpaper(){const w=D.masters.wallpaper||{},el=$('#wp');let src='';
 if(w.source==='preset')src=PRE[w.presetId]||PRE.valley;else if(w.source==='custom')src=w.customType==='upload'?D.wpUp:w.customUrl;
 if(!src){el.style.display='none';return}
 const dev=innerWidth<=640?'phone':innerWidth<=1024?'tablet':'desktop',f=(w.fit||{})[dev]||{},x=(f.x==null?.5:f.x)*100,y=(f.y==null?.5:f.y)*100;
 el.style.cssText=`display:block;background-image:url('${String(src).replace(/'/g,'%27')}');background-position:${x}% ${y}%;transform:scale(${Math.max(1,f.zoom||1)});transform-origin:${x}% ${y}%;--dim:${(w.dim==null?25:w.dim)/100}`}
function header(){const u=D.user||'',p=D.photo||D.masters.userPhotoUrl||'',pp=u.trim().split(/\s+/).filter(Boolean),ini=pp.length?(pp[0][0]+(pp.length>1?pp[pp.length-1][0]:'')).toUpperCase():'👤';
 $('#ph').innerHTML=`<div class="ph">${p?`<img src="${esc(p)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">`:''}<span style="${p?'display:none':''}">${esc(ini)}</span></div>`;
 const im=$('#ph img');if(im)im.onload=()=>{};if(p&&im)im.onerror=()=>{im.remove();$('#ph span').style.display=''};
 $('#who').textContent=(u||'TTL user')+' · data from '+D.src+' (read-only)'}
function build(){const tm={};(D.tasks||[]).forEach(t=>{if(t)tm[t.id]=t});
 rows=(Array.isArray(D.log)?D.log:[]).filter(e=>e&&e.startTs).map(e=>{const t=tm[e.taskId];let s=e.durationSecs;
  if(s==null){if(e.endTs)s=(e.endTs-e.startTs)/1000;else if(t){let ms=t.accumulatedMs||0;if(t.status==='running'&&t.segmentStart)ms+=Date.now()-t.segmentStart;s=ms/1000}else s=0}
  const cf=e.customFields||{};return{e,d:ymd(e.startTs),m:Math.max(0,s/60),st:e.status||e.taskStatus||cf.status||(t&&t.status)||''}})}
function val(r,k){if(k==='date')return r.d;if(k==='month')return r.d.slice(0,7);
 if(k==='week'){const d=new Date(r.d+'T00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
 if(k==='weekday')return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(r.d+'T00:00').getDay()];
 if(k==='effort')return Math.round(r.m);if(k==='status')return r.st||'—';
 if(k==='heading')return r.e.heading||'—';
 const v=r.e[k]!=null?r.e[k]:(r.e.customFields||{})[k];return v===''||v==null?'—':String(v).trim()||'—'}
const kws=()=>F.kw.concat(F.q.trim()?[F.q.trim()]:[]).map(s=>s.toLowerCase());
function fr(){const kw=kws();return rows.filter(r=>(!F.from||r.d>=F.from)&&(!F.to||r.d<=F.to)&&FK.every(k=>!F[k].length||F[k].includes(val(r,k)))&&kw.every(q=>[r.e.heading,r.e.description,r.e.module].some(x=>String(x||'').toLowerCase().includes(q))))}
const mv=(r,met)=>met==='count'?1:met==='hours'?r.m/60:r.m;
const fmt=(v,met)=>met==='count'?Math.round(v):met==='hours'?(+v).toFixed(1)+'h':Math.round(v)+'m';
function agg(rs,f,met,n){const m=new Map();rs.forEach(r=>{const k=String(val(r,f));m.set(k,(m.get(k)||0)+mv(r,met))});let a=[...m].map(([k,v])=>({k,v}));
 if(f==='weekday')a.sort((x,y)=>WD.indexOf(x.k)-WD.indexOf(y.k));else if(TIME.includes(f)){a.sort((x,y)=>x.k<y.k?-1:1);if(n)a=a.slice(-n)}else{a.sort((x,y)=>y.v-x.v);if(n)a=a.slice(0,n)}return a}
function aggS(rs,f,met,n,sp){const a=agg(rs,f,met,n),keys=new Set(a.map(x=>x.k)),tot=new Map(),cell=new Map();
 rs.forEach(r=>{if(!keys.has(String(val(r,f))))return;const s=String(val(r,sp));tot.set(s,(tot.get(s)||0)+mv(r,met))});
 const ser=[...tot].sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>x[0]);let other=false;
 rs.forEach(r=>{const k=String(val(r,f));if(!keys.has(k))return;let s=String(val(r,sp));if(!ser.includes(s)){s='Other';other=true}const id=k+'\u0001'+s;cell.set(id,(cell.get(id)||0)+mv(r,met))});
 return{a,S:other?ser.concat('Other'):ser,get:(k,s)=>cell.get(k+'\u0001'+s)||0}}
function kpi(rs,m){const min=rs.reduce((s,r)=>s+r.m,0),days=new Set(rs.map(r=>r.d)).size;
 return m==='hours'?(min/60).toFixed(1)+'h':m==='minutes'?Math.round(min).toLocaleString():m==='entries'?rs.length:m==='tasks'?new Set(rs.map(r=>r.e.taskSyncId||r.e.taskId||r.e.heading)).size:m==='days'?days:(days?min/60/days:0).toFixed(1)+'h'}
function csv(name,head,data){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+[head,...data].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download=name.replace(/[^\w\-]+/g,'_')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
// ---- adapted log-table engine: sort, resize, pin left/right, show/hide/reorder, paging (state kept per widget in this page's own layout)
