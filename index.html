<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Effort Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--radius-md:6px;--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace}
body{margin:0;background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font,'IBM Plex Sans',system-ui,sans-serif);min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#wp{position:fixed;inset:0;z-index:-1;display:none;background-size:cover;background-repeat:no-repeat;pointer-events:none;overflow:hidden;will-change:transform}
#wp::after{content:"";position:absolute;inset:0;background:var(--bg-tertiary);opacity:var(--dim,.25)}
.wrap{max-width:1500px;margin:0 auto;padding:12px}
.card,header.top,.fbar{background:color-mix(in srgb,var(--bg) 93%,transparent);border:1px solid var(--border);border-radius:12px}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.ph{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--blue-mid);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
header.top h1{font-size:1.1rem;margin:0}header.top small{color:var(--text-secondary);display:block}
.sp{flex:1}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-3px;pointer-events:none}
.tt{min-width:0}
#tip{position:fixed;inset:auto;margin:0;border:0;overflow:visible;pointer-events:none;max-width:min(260px,calc(100vw - 16px));padding:6px 10px;border-radius:var(--radius-md);background:var(--text-primary);color:var(--bg);font:500 12px/1.35 var(--font-mono);letter-spacing:.02em;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
@media print{#tip{display:none!important}}
/* sticky header + filters (collapses on scroll down, expands on scroll up) */
html{overflow-anchor:none;scrollbar-gutter:stable}
#stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin-bottom:10px;padding-bottom:6px;background:transparent;box-shadow:0 0 0 rgba(0,0,0,0);transition:background-color .25s ease,box-shadow .25s ease}
#stick.stuck{background:color-mix(in srgb,var(--bg-tertiary) 96%,transparent);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0;margin-left:auto;overflow:hidden;max-width:1000px;max-height:160px;opacity:1;transition:max-width .3s cubic-bezier(.4,0,.2,1),max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s ease,visibility 0s}
/* header buttons: adapted from Task Time Logger (.btn / .btn-primary / .btn-highlight) */
header.top .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;min-height:44px;border:1px solid var(--border-md);border-radius:var(--radius-md);background:var(--bg);color:var(--text-primary);font-size:12.5px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06);font-family:var(--font-mono);letter-spacing:.02em;text-decoration:none}
header.top .btn:hover{background:var(--bg-secondary);border-color:var(--text-tertiary)}
header.top .btn .ic{width:14px;height:14px;stroke-width:2.2;vertical-align:0}
header.top .btn-primary{background:var(--blue-mid);color:#1a1108;border-color:var(--blue-mid);font-weight:600;box-shadow:0 0 0 3px var(--blue-bg),0 2px 10px rgba(232,98,44,.25)}
header.top .btn-highlight{background:var(--blue-mid);color:#1a1108;border-color:var(--blue-mid);font-weight:600;box-shadow:0 0 0 3px var(--blue-bg),0 2px 10px rgba(232,98,44,.3)}
header.top #bTtl{min-width:190px;padding:8px 22px}
header.top .btn-primary:hover,header.top .btn-highlight:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
header.top{transition:padding .3s cubic-bezier(.4,0,.2,1),row-gap .3s cubic-bezier(.4,0,.2,1)}
.ph{transition:width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1),font-size .3s ease}
header.top h1{transition:font-size .3s ease}
#stick.compact header.top{padding:6px 14px;row-gap:0}
#stick.compact .ph{width:34px;height:34px;font-size:.8rem}
#stick.compact .acts{max-height:0;opacity:0;visibility:hidden;pointer-events:none;transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .15s ease,visibility 0s .3s}
#stick.compact header.top h1{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stick.compact header.top .btn{min-height:36px;padding:5px 12px}
@media(min-width:641px){#stick.compact header.top #bTtl{padding:5px 22px}header.top .acts{flex:0 0 100%;max-width:100%;margin-left:0}#stick.compact .acts{max-width:100%}}
button,select,input,a.btn{font:inherit;color:var(--text-primary);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px}
button{cursor:pointer}button:hover,a.btn:hover{border-color:var(--blue-mid)}
button.pri,a.btn.pri{background:var(--blue-mid);color:#fff;border-color:var(--blue-mid)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.fbar{margin:8px 0 0;padding:8px 10px}
.fhead{display:flex;align-items:center;gap:8px}#bFil{display:inline-flex;align-items:center;gap:6px}.fhead .sm{flex:1;min-width:0;color:var(--text-secondary);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcoll{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1),opacity .22s ease}
.fcoll>.fin{min-height:0;overflow:hidden}
.fbar.col .fcoll{grid-template-rows:0fr;opacity:0}
.fbar.col .fcoll>.fin{visibility:hidden;transition:visibility 0s .3s}
.fbody{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-top:8px;max-height:68vh;overflow:auto;overscroll-behavior:contain}
.fbody>label{font-size:.72rem;color:var(--text-secondary);display:grid;gap:2px}
.fbody .q{grid-column:span 2}.fbody .full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{padding:3px 10px;min-height:28px;font-size:.8rem}
.kw{display:inline-flex;gap:4px;align-items:center;background:var(--bg-secondary);border-radius:14px;padding:2px 4px 2px 10px;font-size:.8rem}.kw button{border:0;background:none;min-height:22px;padding:0 6px;display:inline-flex;align-items:center}
details.ms{position:relative}details.ms>summary{list-style:none;cursor:pointer;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px;display:flex;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--text-primary)}
details.ms>summary .r{display:inline-flex;align-items:center;gap:6px}details.ms>summary .ic{color:var(--text-tertiary);transition:transform .15s}details.ms[open]>summary .ic{transform:rotate(180deg)}details.ms[open]>summary{border-color:var(--blue-mid)}
details.ms .menu{position:absolute;z-index:20;left:0;min-width:100%;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menu label{display:flex;gap:6px;align-items:center;padding:3px 4px;font-size:.85rem;white-space:nowrap;color:var(--text-primary)}.menu button{width:100%;margin-top:4px;min-height:28px}
#grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.w{padding:12px;min-width:0}
.w:not(.fs){content-visibility:auto;contain-intrinsic-size:auto 320px}
body.fsmode{overflow:hidden}body.fsmode .w:not(.fs),body.fsmode #stick,body.fsmode #wp{visibility:hidden}
.w>header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.w h3{margin:0;font-size:.9rem;color:var(--text-secondary);font-weight:600;flex:1;min-width:0}
.tb{display:none;gap:4px}body.edit .tb{display:flex}body.edit .w{outline:2px dashed var(--border)}
.wt{display:flex;gap:4px}.tb button,.wt button{padding:0 8px;min-height:28px;display:inline-grid;place-items:center}
.w.fs{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;background:var(--bg);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.w.fs .sc{max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px)}
.kv{font-size:2rem;font-weight:700;color:var(--blue-mid);line-height:1.2}
.pb{height:6px;border-radius:4px;background:var(--bg-secondary);margin:8px 0 6px;overflow:hidden}.pb i{display:block;height:100%;border-radius:4px;background:var(--green-mid);transition:width .4s ease}
.kd{font-size:.78rem;color:var(--text-secondary);line-height:1.4}
.mt{color:var(--text-tertiary);font-size:.85rem}
.hb{display:grid;grid-template-columns:minmax(60px,32%) 1fr auto;gap:8px;align-items:center;font-size:.8rem;margin:5px 0}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t{background:var(--bg-secondary);border-radius:6px;height:12px}.hb i{display:block;height:100%;border-radius:6px}
.vb{display:flex;gap:6px;align-items:flex-end;height:200px;overflow-x:auto}
.vb .c{flex:1;min-width:40px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.68rem}
.vb .c>i{width:70%;border-radius:4px 4px 0 0;min-height:2px}.vb .c span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.stk{width:70%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}.stk i{width:100%;display:block}
.lg2{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;margin-top:8px;color:var(--text-secondary)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:130px;flex:none}.lg{font-size:.8rem;flex:1;min-width:120px}.lg div{display:flex;gap:6px;margin:3px 0}.lg b{margin-left:auto}.lg i{width:10px;height:10px;border-radius:3px;margin-top:4px;flex:none}
.sc{overflow:auto;max-height:440px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:var(--bg);color:var(--text-secondary);z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
table.g{table-layout:fixed;width:auto}table.g td{white-space:normal;word-break:break-word}
th .pn{opacity:.4;margin-left:4px;display:inline-flex;vertical-align:middle}th>.ic{margin-left:4px}th .ic{width:12px;height:12px;vertical-align:middle}th .pn.on{opacity:1;color:var(--blue-mid)}
th .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;touch-action:none}th .rz:hover{background:var(--blue-mid);opacity:.5}
th,td{position:relative}tr[data-a=hist]{cursor:pointer}tr[data-a=hist]:hover td{background:var(--bg-secondary)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:.8rem;color:var(--text-secondary);flex-wrap:wrap}.pg button,.pg select{min-height:28px;padding:2px 8px}.pg button{display:inline-flex;align-items:center;gap:4px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text-primary);width:min(560px,94vw);padding:16px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}.fg label{display:grid;gap:3px;font-size:.78rem;color:var(--text-secondary)}.fg .full{grid-column:1/-1}
.cl>div{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}.cl label{flex:1;display:flex;gap:6px;align-items:center}.cl button{min-height:28px;padding:0 8px}
#msg{margin:10px 0;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--amber-mid);font-size:.85rem;display:none}
@media(max-width:1024px){#grid{grid-template-columns:repeat(6,minmax(0,1fr))}.s3,.s4{grid-column:span 3}.s6,.s8,.s12{grid-column:span 6}}
@media(max-width:640px){header.top .acts{width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}header.top .btn span{display:none}header.top .btn{min-height:44px;padding:6px}header.top #bTtl{min-width:60px;padding:6px 16px}header.top .tt{flex:1}.wrap{padding:8px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:span 1}.s4,.s6,.s8,.s12{grid-column:span 2}.fbody .q{grid-column:1/-1}.fg{grid-template-columns:1fr}.kv{font-size:1.5rem}header.top .sp{display:none}.pg{justify-content:space-between}}
@media print{.w:not(.fs){content-visibility:visible}body{background:#fff}#stick{position:static;background:none!important;box-shadow:none!important}header.top button,header.top a,.fbar .fhead button,.tb,.wt,.pg,.fbody{display:none!important}.fbar{position:static}#wp{display:none!important}.w{break-inside:avoid}.sc{max-height:none}}
</style></head><body>
