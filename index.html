<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TTL Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font,'IBM Plex Sans',system-ui,sans-serif);min-height:100vh;overflow-x:hidden}
#wp{position:fixed;inset:0;z-index:-1;display:none;background-size:cover;background-repeat:no-repeat;pointer-events:none}
#wp::after{content:"";position:absolute;inset:0;background:var(--bg-tertiary);opacity:var(--dim,.25)}
.wrap{max-width:1500px;margin:0 auto;padding:12px}
.card,header.top,.fbar{background:color-mix(in srgb,var(--bg) 93%,transparent);border:1px solid var(--border);border-radius:12px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--blue-mid);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
header.top h1{font-size:1.1rem;margin:0}header.top small{color:var(--text-secondary);display:block}
.sp{flex:1}
button,select,input{font:inherit;color:var(--text-primary);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px}
button{cursor:pointer}button:hover{border-color:var(--blue-mid)}a.btn{font:inherit;text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:34px;white-space:nowrap}a.btn:hover{border-color:var(--blue-mid)}button.pri,a.btn.pri{background:var(--blue-mid);color:#fff;border-color:var(--blue-mid)}
.fbar{position:sticky;top:0;z-index:5;margin:10px 0;padding:10px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.fbar label{font-size:.72rem;color:var(--text-secondary);display:grid;gap:2px}
.fbar .q{grid-column:span 2}.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chips button{padding:3px 10px;min-height:28px;font-size:.8rem}
#grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.w{padding:12px;min-width:0}
.w>header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.w h3{margin:0;font-size:.9rem;color:var(--text-secondary);font-weight:600;flex:1;min-width:0}
.tb{display:none;gap:4px}body.edit .tb{display:flex}body.edit .w{outline:2px dashed var(--border)}
.tb button{padding:0 8px;min-height:28px}
.kv{font-size:2rem;font-weight:700;color:var(--blue-mid);line-height:1.2}
.mt{color:var(--text-tertiary);font-size:.85rem}
.hb{display:grid;grid-template-columns:minmax(60px,32%) 1fr auto;gap:8px;align-items:center;font-size:.8rem;margin:5px 0}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .t{background:var(--bg-secondary);border-radius:6px;height:12px}.hb i{display:block;height:100%;border-radius:6px}
.vb{display:flex;gap:6px;align-items:flex-end;height:190px;overflow-x:auto}
.vb .c{flex:1;min-width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.68rem}
.vb .c i{width:70%;border-radius:4px 4px 0 0;min-height:2px}.vb .c span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn svg{width:130px;flex:none}.lg{font-size:.8rem;flex:1;min-width:120px}.lg div{display:flex;gap:6px;margin:3px 0}.lg b{margin-left:auto}.lg i{width:10px;height:10px;border-radius:3px;margin-top:4px;flex:none}
.sc{overflow-x:auto;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{position:sticky;top:0;background:var(--bg);color:var(--text-secondary)}td.d{min-width:160px;max-width:340px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text-primary);width:min(520px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}.fg label{display:grid;gap:3px;font-size:.78rem;color:var(--text-secondary)}.fg .full{grid-column:1/-1}
.cols{display:flex;flex-wrap:wrap;gap:8px}.cols label{display:flex;gap:4px;align-items:center}
#msg{margin:10px 0;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--amber-mid);font-size:.85rem;display:none}
@media(max-width:1024px){#grid{grid-template-columns:repeat(6,minmax(0,1fr))}.s3,.s4{grid-column:span 3}.s6,.s8,.s12{grid-column:span 6}}
@media(max-width:640px){.wrap{padding:8px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:span 1}.s4,.s6,.s8,.s12{grid-column:span 2}.fbar .q{grid-column:1/-1}.fg{grid-template-columns:1fr}.kv{font-size:1.5rem}header.top .sp{display:none}}
</style></head><body>
<div id="wp"></div>
<div class="wrap">
<header class="top"><div id="ph"></div><div><h1>Task Time Dashboard</h1><small id="who"></small></div><div class="sp"></div>
<a href="tasklogger.html" id="bTTL" class="btn pri" title="Open Task Time Logger">⏱ Task Time Logger</a><button id="bLoad" title="Load a TTL JSON backup (read-only)">Load data</button><button id="bAdd">+ Widget</button><button id="bEdit" class="pri">Edit layout</button><button id="bReset">Reset</button></header>
<div id="msg"></div>
<div class="fbar">
<label>From<input type="date" id="fFrom"></label><label>To<input type="date" id="fTo"></label>
<label><span id="lP">Project</span><select id="fProject"></select></label>
<label><span id="lN">Nature of task</span><select id="fNature"></select></label>
<label><span id="lM">Module</span><select id="fModule"></select></label>
<label class="q">Search task, description, module<input type="search" id="fQ" placeholder="Type to search…"></label>
<div class="chips"><button data-p="today">Today</button><button data-p="7">7 days</button><button data-p="30">30 days</button><button data-p="month">This month</button><button data-p="all">All</button><button data-p="clear">Clear filters</button><span class="mt" id="cnt" style="align-self:center"></span></div>
</div>
<div id="grid"></div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<dialog id="dlg"><div class="fg">
<label class="full">Title<input id="eT"></label>
<label>Chart type<select id="eY"><option value="kpi">KPI number</option><option value="bar">Column chart</option><option value="hbar">Bar chart</option><option value="line">Line chart</option><option value="donut">Donut</option><option value="gtable">Grouped table</option><option value="entries">Entries table</option></select></label>
<label>Width<select id="eS"><option value="3">Small (¼)</option><option value="4">Third</option><option value="6">Half</option><option value="8">Two-thirds</option><option value="12">Full</option></select></label>
<label id="gF">Group by<select id="eF"></select></label>
<label id="gM">Measure<select id="eM"></select></label>
<label id="gN">Max items<input type="number" id="eN" min="1" max="200"></label>
<label class="full" id="gC">Columns<div class="cols" id="eC"></div></label>
</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="eX">Cancel</button><button class="pri" id="eOk">Save</button></div></dialog>
<script>
(function(){
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pad=n=>String(n).padStart(2,'0');
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const J=(k,d)=>{try{const v=JSON.parse(LS(k));return v==null?d:v}catch(e){return d}};
// ---- TTL data is READ ONLY: no ttl_* key is ever written. Only ttl_dash_layout_v1 (this page's own layout) is saved.
const LAYOUT_KEY='ttl_dash_layout_v1';
const LIGHT={'--bg':'#fffdf8','--bg-secondary':'#f7f0dd','--bg-tertiary':'#ede1c3','--text-primary':'#26211a','--text-secondary':'#5a4f3c','--text-tertiary':'#8a7f68','--border':'rgba(38,33,26,0.16)','--green-mid':'#2f8f76','--amber-mid':'#a3821f','--blue-mid':'#c94f1f','--purple-mid':'#6a5cb0','--red-mid':'#b1403c'};
const DARK={'--bg':'#1c2230','--bg-secondary':'#232a3d','--bg-tertiary':'#0c0e13','--text-primary':'#edeff4','--text-secondary':'#8b93a7','--text-tertiary':'#5b6478','--border':'#2e3549','--green-mid':'#3fab8f','--amber-mid':'#d1b954','--blue-mid':'#e8622c','--purple-mid':'#8b7fd1','--red-mid':'#d9534f'};
const PAL=['--blue-mid','--green-mid','--amber-mid','--purple-mid','--red-mid'],col=i=>`var(${PAL[i%5]})`;
const PRE={valley:'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80',forest:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=2000&q=80',night:'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80'};
const FONTS={default:"'IBM Plex Sans',system-ui,sans-serif",spacegrotesk:"'Space Grotesk','IBM Plex Sans',sans-serif",mono:"'IBM Plex Mono',ui-monospace,monospace",serif:"Georgia,'Times New Roman',serif"},SCALE={sm:.9,md:1,lg:1.1,xl:1.2};
const DEFCOLS=[['date','Date'],['employee','Employee Name'],['project','Project'],['module','Module / Feature'],['nature','Nature of Task'],['ticket','Ticket #'],['description','Task progress / Effort description'],['effort','Effort (Minutes)'],['status','Status'],['remark','Remark']].map(([key,label])=>({key,label,showInLogTable:true}));
const TIME=['date','week','month','weekday'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],TL={date:'Day',week:'Week',month:'Month',weekday:'Weekday'};
let D,rows=[],F={from:'',to:'',project:'',nature:'',module:'',q:''},L,editing=null;
function readLocal(){return{log:J('ttl_log',[]),masters:J('ttl_masters',{}),user:LS('ttl_username')||'',theme:LS('ttl_theme')||'system',wpUp:LS('ttl_wallpaper_upload')||'',src:'this browser'}}
const cols=()=>Array.isArray(D.masters.logColumns)&&D.masters.logColumns.length?D.masters.logColumns:DEFCOLS;
const label=k=>TL[k]||(cols().find(c=>c.key===k)||{}).label||k;
function theme(){const m=D.masters,dark=D.theme==='dark'||(D.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
 const o=((m.colorPrefs||{})[dark?'dark':'light'])||{},v=Object.assign({},dark?DARK:LIGHT);
 Object.keys(o).forEach(k=>{if(/^#[0-9a-f]{3,8}$/i.test(o[k]))v[k]=o[k]});
 Object.keys(v).forEach(k=>document.documentElement.style.setProperty(k,v[k]));
 const f=m.fontPrefs||{};let fam=FONTS[f.family]||FONTS.default;if(f.family==='custom'&&f.customFamily)fam=String(f.customFamily).replace(/^\s*font-family\s*:/i,'').replace(/;+\s*$/,'');
 document.documentElement.style.setProperty('--font',fam);document.documentElement.style.fontSize=(SCALE[f.size]||1)*16+'px'}
function wallpaper(){const w=D.masters.wallpaper||{},el=$('#wp');let src='';
 if(w.source==='preset')src=PRE[w.presetId]||PRE.valley;else if(w.source==='custom')src=w.customType==='upload'?D.wpUp:w.customUrl;
 if(!src){el.style.display='none';return}
 const dev=innerWidth<=640?'phone':innerWidth<=1024?'tablet':'desktop',f=(w.fit||{})[dev]||{},x=(f.x==null?.5:f.x)*100,y=(f.y==null?.5:f.y)*100;
 el.style.cssText=`display:block;background-image:url('${String(src).replace(/'/g,'%27')}');background-position:${x}% ${y}%;transform:scale(${Math.max(1,f.zoom||1)});transform-origin:${x}% ${y}%;--dim:${(w.dim==null?25:w.dim)/100}`}
function header(){const u=D.user||'TTL user',p=D.masters.userPhotoUrl;
 $('#ph').innerHTML=p?`<img class="ph" src="${esc(p)}" alt="">`:`<div class="ph">${esc(u.slice(0,1).toUpperCase())}</div>`;
 $('#who').textContent=u+' · data from '+D.src+' (read-only)'}
function build(){rows=(Array.isArray(D.log)?D.log:[]).filter(e=>e&&e.startTs).map(e=>{const s=e.durationSecs!=null?e.durationSecs:(e.endTs?(e.endTs-e.startTs)/1000:0);return{e,d:ymd(e.startTs),m:Math.max(0,s/60)}})}
function val(r,k){if(k==='date')return r.d;if(k==='month')return r.d.slice(0,7);
 if(k==='week'){const d=new Date(r.d+'T00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
 if(k==='weekday')return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(r.d+'T00:00').getDay()];
 if(k==='effort')return Math.round(r.m);
 const v=r.e[k]!=null?r.e[k]:(r.e.customFields||{})[k];return v===''||v==null?'—':String(v)}
function fr(){const q=F.q.trim().toLowerCase();return rows.filter(r=>(!F.from||r.d>=F.from)&&(!F.to||r.d<=F.to)&&['project','nature','module'].every(k=>!F[k]||val(r,k)===F[k])&&(!q||[r.e.heading,r.e.description,r.e.module].some(x=>String(x||'').toLowerCase().includes(q))))}
function agg(rs,f,met,n){const m=new Map();rs.forEach(r=>{const k=String(val(r,f));m.set(k,(m.get(k)||0)+(met==='count'?1:r.m/60))});let a=[...m].map(([k,v])=>({k,v}));
 if(f==='weekday')a.sort((x,y)=>WD.indexOf(x.k)-WD.indexOf(y.k));else if(TIME.includes(f)){a.sort((x,y)=>x.k<y.k?-1:1);if(n)a=a.slice(-n)}else a.sort((x,y)=>y.v-x.v);
 return n&&!TIME.includes(f)?a.slice(0,n):a}
const fmt=(v,m)=>m==='count'?Math.round(v):(+v).toFixed(1)+'h';
function kpi(rs,m){const h=rs.reduce((s,r)=>s+r.m,0)/60,days=new Set(rs.map(r=>r.d)).size;
 return m==='hours'?h.toFixed(1)+'h':m==='entries'?rs.length:m==='tasks'?new Set(rs.map(r=>r.e.taskSyncId||r.e.taskId||r.e.heading)).size:m==='days'?days:(days?h/days:0).toFixed(1)+'h'}
function body(w,rs){
 if(!rs.length)return'<p class="mt">No entries match the filters.</p>';
 if(w.type==='kpi')return`<div class="kv">${kpi(rs,w.metric)}</div>`;
 if(w.type==='entries'){const cs=(w.cols&&w.cols.length?w.cols:cols().filter(c=>c.showInLogTable!==false).map(c=>c.key));
  const list=[...rs].sort((a,b)=>b.e.startTs-a.e.startTs).slice(0,w.n||50);
  return`<div class="sc"><table><tr>${cs.map(k=>`<th>${esc(label(k))}</th>`).join('')}</tr>${list.map(r=>`<tr>${cs.map(k=>`<td${/desc|remark/.test(k)?' class="d"':''}>${esc(k==='heading'?r.e.heading:val(r,k))}</td>`).join('')}</tr>`).join('')}</table></div>`}
 const a=agg(rs,w.field,w.metric,w.n||10),max=Math.max(...a.map(x=>x.v),1),tot=a.reduce((s,x)=>s+x.v,0)||1;
 if(w.type==='hbar')return a.map((x,i)=>`<div class="hb"><span class="l" title="${esc(x.k)}">${esc(x.k)}</span><div class="t"><i style="width:${x.v/max*100}%;background:${col(i)}"></i></div><b>${fmt(x.v,w.metric)}</b></div>`).join('');
 if(w.type==='bar')return`<div class="vb">${a.map((x,i)=>`<div class="c" title="${esc(x.k)}"><b>${fmt(x.v,w.metric)}</b><i style="height:${x.v/max*75}%;background:${col(i)}"></i><span>${esc(x.k)}</span></div>`).join('')}</div>`;
 if(w.type==='gtable')return`<div class="sc"><table><tr><th>${esc(label(w.field))}</th><th>${w.metric==='count'?'Entries':'Hours'}</th><th>%</th></tr>${a.map(x=>`<tr><td>${esc(x.k)}</td><td>${fmt(x.v,w.metric)}</td><td>${(x.v/tot*100).toFixed(0)}%</td></tr>`).join('')}</table></div>`;
 if(w.type==='donut'){let acc=0;return`<div class="dn"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--bg-secondary)" stroke-width="5"/>${a.map((x,i)=>{const p=x.v/tot*100,s=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${col(i)}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}"/>`;acc+=p;return s}).join('')}</svg><div class="lg">${a.map((x,i)=>`<div><i style="background:${col(i)}"></i><span>${esc(x.k)}</span><b>${fmt(x.v,w.metric)}</b></div>`).join('')}</div></div>`}
 if(w.type==='line'){const W=400,H=150,p=14,pts=a.map((x,i)=>[p+(a.length>1?i/(a.length-1):.5)*(W-2*p),H-p-x.v/max*(H-2*p)]),ln=pts.map(q=>q.join(',')).join(' ');
  return`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto"><polygon points="${p},${H-p} ${ln} ${pts[pts.length-1][0]},${H-p}" fill="var(--blue-mid)" opacity=".15"/><polyline points="${ln}" fill="none" stroke="var(--blue-mid)" stroke-width="2"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="var(--blue-mid)"/>`).join('')}<g font-size="9" fill="var(--text-secondary)"><text x="${p}" y="${H+12}">${esc(a[0].k)}</text><text x="${W-p}" y="${H+12}" text-anchor="end">${esc(a[a.length-1].k)}</text><text x="${W-p}" y="10" text-anchor="end">max ${fmt(max,w.metric)}</text></g></svg>`}
 return''}
function render(){const rs=fr();$('#cnt').textContent=rs.length+' of '+rows.length+' entries';
 $('#grid').innerHTML=L.map((w,i)=>{const sub=w.type==='kpi'?'':` <span class="mt">· ${w.type==='entries'?'latest':'by '+esc(label(w.field))}</span>`;
  return`<section class="w card s${w.span}" data-i="${i}"><header><h3>${esc(w.title)}${sub}</h3><div class="tb"><button data-a="up">↑</button><button data-a="dn">↓</button><button data-a="ed">✎</button><button data-a="rm">✕</button></div></header>${body(w,rs)}</section>`}).join('')||'<p class="mt">No widgets. Use “+ Widget”.</p>'}
const save=()=>{try{localStorage.setItem(LAYOUT_KEY,JSON.stringify(L))}catch(e){}};
const DEF=()=>[{id:'k1',title:'Total hours',type:'kpi',metric:'hours',span:3},{id:'k2',title:'Entries',type:'kpi',metric:'entries',span:3},{id:'k3',title:'Active days',type:'kpi',metric:'days',span:3},{id:'k4',title:'Average per day',type:'kpi',metric:'avg',span:3},{id:'c1',title:'Hours',type:'donut',field:'project',metric:'hours',span:4,n:8},{id:'c2',title:'Hours',type:'hbar',field:'nature',metric:'hours',span:4,n:8},{id:'c3',title:'Hours',type:'bar',field:'module',metric:'hours',span:4,n:8},{id:'c4',title:'Daily effort',type:'line',field:'date',metric:'hours',span:12,n:31},{id:'t1',title:'Task entries',type:'entries',span:12,n:50,cols:[]}];
function fields(){const skip=['description','remark','effort','date','taskId'];return['date','week','month','weekday'].concat(cols().filter(c=>!skip.includes(c.key)).map(c=>c.key))}
function fillFilters(){[['project','#fProject','#lP'],['nature','#fNature','#lN'],['module','#fModule','#lM']].forEach(([k,s,l])=>{
  $(l).textContent=label(k);const set=[...new Set(rows.map(r=>val(r,k)))].filter(v=>v!=='—').sort((a,b)=>a.localeCompare(b));
  $(s).innerHTML='<option value="">All</option>'+set.map(v=>`<option>${esc(v)}</option>`).join('');$(s).value=F[k]})}
function syncUI(){$('#fFrom').value=F.from;$('#fTo').value=F.to;$('#fQ').value=F.q;['project','nature','module'].forEach(k=>$('#f'+k[0].toUpperCase()+k.slice(1)).value=F[k])}
function boot(){theme();wallpaper();header();build();fillFilters();L=J(LAYOUT_KEY,null);if(!Array.isArray(L))L=DEF();
 const m=$('#msg');m.style.display=rows.length?'none':'block';m.textContent='No TTL log data found here. Open this file from the same location/origin as tasklogger.html, or use “Load data” to read a TTL JSON backup (nothing is written back).';render()}
function ingest(o){o=o.data||o;const g=(a,b)=>{let v=o[a]!=null?o[a]:o[b];if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){}}return v};
 const l=g('ttl_log','logEntries');if(!Array.isArray(l))throw 0;D={log:l,masters:g('ttl_masters','masters')||{},user:o.ttl_username||o.userName||'',theme:D.theme,wpUp:o.wallpaperUpload||'',src:'imported file'};boot()}
// ---- events
['fFrom','fTo','fProject','fNature','fModule','fQ'].forEach(id=>$('#'+id).addEventListener('input',()=>{F.from=$('#fFrom').value;F.to=$('#fTo').value;F.project=$('#fProject').value;F.nature=$('#fNature').value;F.module=$('#fModule').value;F.q=$('#fQ').value;render()}));
document.querySelector('.chips').addEventListener('click',e=>{const p=e.target.dataset.p;if(!p)return;const t=new Date(),n=ymd(t);
 if(p==='clear')F={from:'',to:'',project:'',nature:'',module:'',q:''};else{F.from=p==='today'?n:p==='7'?ymd(t-6*864e5):p==='30'?ymd(t-29*864e5):p==='month'?n.slice(0,8)+'01':'';F.to=p==='all'?'':n}syncUI();render()});
$('#bEdit').onclick=()=>{document.body.classList.toggle('edit');$('#bEdit').textContent=document.body.classList.contains('edit')?'Done':'Edit layout'};
$('#bReset').onclick=()=>{if(confirm('Reset dashboard layout? (TTL data is not touched)')){L=DEF();save();render()}};
$('#bLoad').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{ingest(JSON.parse(await f.text()))}catch(x){alert('That file does not look like a TTL JSON export.')}e.target.value=''};
$('#grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.closest('.w').dataset.i,a=b.dataset.a;
 if(a==='rm'&&confirm('Delete this widget?'))L.splice(i,1);else if(a==='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];else if(a==='dn'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];else if(a==='ed')return openEd(i);save();render()});
$('#bAdd').onclick=()=>openEd(-1);
function typeUI(){const t=$('#eY').value;$('#gF').style.display=(t==='kpi'||t==='entries')?'none':'';$('#gC').style.display=t==='entries'?'':'none';$('#gN').style.display=t==='kpi'?'none':'';
 $('#eM').innerHTML=(t==='kpi'?[['hours','Total hours'],['entries','Entries'],['tasks','Distinct tasks'],['days','Active days'],['avg','Avg hours / day']]:[['hours','Hours'],['count','Entry count']]).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');$('#eM').value=editing.metric||$('#eM').options[0].value;$('#gM').style.display=t==='entries'?'none':''}
function openEd(i){editing=i<0?{id:'w'+Date.now(),title:'New widget',type:'hbar',field:'project',metric:'hours',span:6,n:10,cols:[]}:{...L[i]};editing._i=i;
 $('#eT').value=editing.title;$('#eY').value=editing.type;$('#eS').value=editing.span;$('#eN').value=editing.n||10;
 $('#eF').innerHTML=fields().map(k=>`<option value="${k}">${esc(label(k))}</option>`).join('');$('#eF').value=editing.field||'project';
 const sel=editing.cols&&editing.cols.length?editing.cols:cols().filter(c=>c.showInLogTable!==false).map(c=>c.key);
 $('#eC').innerHTML=cols().map(c=>`<label><input type="checkbox" value="${esc(c.key)}"${sel.includes(c.key)?' checked':''}>${esc(c.label)}</label>`).join('');typeUI();$('#dlg').showModal()}
$('#eY').onchange=()=>{editing.metric=null;typeUI()};$('#eX').onclick=()=>$('#dlg').close();
$('#eOk').onclick=()=>{const w={id:editing.id,title:$('#eT').value||'Widget',type:$('#eY').value,span:+$('#eS').value,field:$('#eF').value,metric:$('#eM').value,n:+$('#eN').value||10,cols:[...document.querySelectorAll('#eC input:checked')].map(x=>x.value)};
 if(editing._i<0)L.push(w);else L[editing._i]=w;save();render();$('#dlg').close()};
addEventListener('resize',()=>{clearTimeout(window._t);window._t=setTimeout(wallpaper,150)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
D=readLocal();boot();
})();
